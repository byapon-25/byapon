{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
<div>
<h2 class="fw-bold">Exams</h2>
<p class="text-muted mb-0">Create and manage examinations.</p>
</div>

<button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addExam">
+ New Exam
</button>
</div>

<div class="card border-0 shadow-sm rounded-4 overflow-hidden">
<div class="table-responsive">

<table class="table table-hover mb-0">

<thead>
<tr>
<th>Exam</th>
<th>Subject</th>
<th>Date</th>
<th>Full Marks</th>
<th>Action</th>
</tr>
</thead>

<tbody>

{% for e in exams %}

<tr>

<td><strong>{{e.title}}</strong></td>
<td>{{e.subject}}</td>
<td>{{e.exam_date}}</td>
<td>{{e.full_marks}}</td>

<td>
<div class="d-flex gap-1 flex-wrap">
<a class="btn btn-sm btn-dark"
href="{{url_for('exam_marks',eid=e.id)}}">
Marks
</a>
<a class="btn btn-sm btn-warning"
href="{{url_for('edit_exam',eid=e.id)}}">
Edit
</a>
<form method="post"
action="{{url_for('delete_exam',eid=e.id)}}"
onsubmit="return confirm('Delete this exam and its marks?');">
<button class="btn btn-sm btn-outline-danger">Delete</button>
</form>
</div>
</td>

</tr>

{% else %}

<tr>
<td colspan="5" class="text-center py-5 text-muted">
No exams created yet.
</td>
</tr>

{% endfor %}

</tbody>
</table>

</div>
</div>


<div class="modal fade" id="addExam">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content">

<form method="post">

<div class="modal-header">
<h5 class="modal-title">Create New Exam</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<div class="mb-3">
<label class="form-label">Exam Title</label>
<input name="title" class="form-control"
placeholder="e.g. Monthly Test" required>
</div>

<div class="mb-3">
<label class="form-label">Subject</label>
<input name="subject" class="form-control"
placeholder="e.g. Mathematics" required>
</div>

<div class="mb-3">
<label class="form-label">Exam Date</label>
<input type="date" name="exam_date"
class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Full Marks</label>
<input type="number" step="0.01"
name="full_marks"
class="form-control"
value="100" required>
</div>

</div>

<div class="modal-footer">
<button type="button"
class="btn btn-outline-secondary"
data-bs-dismiss="modal">
Cancel
</button>

<button class="btn btn-dark">
Create Exam
</button>
</div>

</form>

</div>
</div>
</div>

{% endblock %}
