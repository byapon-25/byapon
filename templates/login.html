<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYAPON Login</title><style>body{margin:0;background:linear-gradient(135deg,#111827,#374151);font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}.box{background:white;width:min(400px,90%);padding:35px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}h1{text-align:center;margin-bottom:8px}.role{text-align:center;color:#667085;margin-bottom:25px}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#111827;color:white;font-size:16px;font-weight:bold;margin-top:12px}.back{text-align:center;margin-top:20px}.back a{color:#111827}</style></head><body><div class="box"><h1>BYAPON</h1><div class="role">{{ role|capitalize }} Login</div><form method="post"><input name="username" placeholder="ID / Username" required><input type="password" name="password" placeholder="Password" required><button type="submit">Login</button></form><div class="back"><a href="/">Back to Home</a></div></div></body></html>
