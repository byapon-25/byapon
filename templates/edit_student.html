{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">✏️ Edit Student</h2>
        <div class="text-muted">Update student information</div>
    </div>

    <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">
        ← Back
    </a>
</div>

<div class="card p-4">

<form method="post">

<div class="row g-3">

<div class="col-md-6">
<label class="form-label">Student ID</label>
<input class="form-control" name="student_id"
       value="{{ student.student_id }}" required>
</div>

<div class="col-md-6">
<label class="form-label">Name</label>
<input class="form-control" name="name"
       value="{{ student.name }}" required>
</div>

<div class="col-md-6">
<label class="form-label">Phone</label>
<input class="form-control" name="phone"
       value="{{ student.phone or '' }}">
</div>

<div class="col-md-6">
<label class="form-label">Guardian</label>
<input class="form-control" name="guardian"
       value="{{ student.guardian or '' }}">
</div>

<div class="col-md-6">
<label class="form-label">Guardian Phone</label>
<input class="form-control" name="guardian_phone"
       value="{{ student.guardian_phone or '' }}">
</div>

<div class="col-md-6">
<label class="form-label">Class</label>
<input class="form-control" name="class_name"
       value="{{ student.class_name or '' }}">
</div>

<div class="col-md-6">
<label class="form-label">Batch</label>
<input class="form-control" name="batch"
       value="{{ student.batch or '' }}">
</div>

<div class="col-md-6">
<label class="form-label">Admission Date</label>
<input class="form-control" type="date"
       name="admission_date"
       value="{{ student.admission_date or '' }}">
</div>

<div class="col-12">
<label class="form-label">Address</label>
<input class="form-control" name="address"
       value="{{ student.address or '' }}">
</div>

<div class="col-md-6">
<label class="form-label">Monthly Fee</label>
<input class="form-control" type="number" step="0.01"
       name="monthly_fee"
       value="{{ student.monthly_fee or 0 }}">
</div>

<div class="col-md-6">
<label class="form-label">New Login Password</label>
<input class="form-control" type="password"
       name="login_password"
       minlength="6"
       placeholder="Blank = keep current password">
</div>

</div>

<div class="mt-4">
<button class="btn btn-dark px-4">💾 Update Student</button>
<a href="{{ url_for('students') }}"
   class="btn btn-outline-secondary ms-2">Cancel</a>
</div>

</form>

</div>

{% endblock %}
