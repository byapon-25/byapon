{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card border-0 shadow-sm rounded-4">
<div class="card-header bg-dark text-white p-4"><h4 class="mb-0">Edit Attendance</h4></div>
<form method="post"><div class="card-body p-4">
<div class="mb-3"><label class="form-label">Student</label>
<input class="form-control" value="{{record.student_code}} — {{record.name}}" readonly></div>
<div class="mb-3"><label class="form-label">Date</label>
<input type="date" name="attendance_date" class="form-control" value="{{record.attendance_date}}" required></div>
<div class="mb-3"><label class="form-label">Status</label>
<select name="status" class="form-select" required>
<option value="Present" {% if record.status=="Present" %}selected{% endif %}>Present</option>
<option value="Absent" {% if record.status=="Absent" %}selected{% endif %}>Absent</option>
</select></div>
</div><div class="card-footer p-3">
<a href="{{url_for('attendance')}}" class="btn btn-outline-secondary">Back</a>
<button class="btn btn-dark">Save Changes</button>
</div></form></div></div></div>
{% endblock %}
