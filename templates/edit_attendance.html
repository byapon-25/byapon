{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">✏️ Edit Attendance</h2>
        <div class="text-muted">Update attendance record</div>
    </div>

    <a href="{{ url_for('attendance') }}" class="btn btn-outline-secondary">
        ← Back
    </a>
</div>

<div class="card p-4">

<form method="post">

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Student</label>
            <select name="student_id" class="form-select" required>
                {% for s in students %}
                <option value="{{ s.id }}"
                    {% if s.id == record.student_id %}selected{% endif %}>
                    {{ s.student_id }} — {{ s.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Date</label>
            <input type="date"
                   name="attendance_date"
                   class="form-control"
                   value="{{ record.attendance_date }}"
                   required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Status</label>
            <select name="status" class="form-select" required>
                <option value="Present"
                    {% if record.status == "Present" %}selected{% endif %}>
                    Present
                </option>
                <option value="Absent"
                    {% if record.status == "Absent" %}selected{% endif %}>
                    Absent
                </option>
            </select>
        </div>

    </div>

    <div class="mt-4">
        <button class="btn btn-dark px-4">
            💾 Update Attendance
        </button>

        <a href="{{ url_for('attendance') }}"
           class="btn btn-outline-secondary ms-2">
            Cancel
        </a>
    </div>

</form>

</div>

{% endblock %}
