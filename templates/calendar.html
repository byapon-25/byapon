{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
<div>
<h2 class="fw-bold mb-1">Calendar</h2>
<p class="text-muted mb-0">Manage coaching days, holidays and important events.</p>
</div>
<div class="d-flex gap-2">
<a href="{{ url_for('dashboard') }}" class="btn btn-outline-dark">
← Dashboard
</a>
<button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addCalendar">
+ Add Date
</button>
</div>
</div>

<div class="card border-0 shadow-sm rounded-4 overflow-hidden">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead>
<tr>
<th>Date</th>
<th>Status</th>
<th>Note / Event</th>
</tr>
</thead>
<tbody>
{% for d in days %}
<tr>
<td><strong>{{d.day_date}}</strong></td>
<td>
<span class="badge {{'text-bg-success' if d.status=='Open' else 'text-bg-danger'}}">
{{d.status}}
</span>
</td>
<td>{{d.note or '-'}}</td>
</tr>
{% else %}
<tr>
<td colspan="3" class="text-center text-muted py-5">
No calendar records yet.
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
</div>

<div class="modal fade" id="addCalendar" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content">
<form method="post">

<div class="modal-header">
<h5 class="modal-title">Add Calendar Date</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<div class="mb-3">
<label class="form-label">Date</label>
<input type="date" name="day_date" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Status</label>
<select name="status" class="form-select" required>
<option value="Open">Open</option>
<option value="Closed">Closed</option>
<option value="Holiday">Holiday</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Note</label>
<textarea name="note" class="form-control" rows="2"
placeholder="Optional note"></textarea>
</div>

</div>

<div class="modal-footer">
<button type="button" class="btn btn-outline-secondary"
data-bs-dismiss="modal">Cancel</button>
<button class="btn btn-dark">Save Date</button>
</div>

</form>
</div>
</div>
</div>

{% endblock %}
