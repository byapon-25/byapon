{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">✏️ Edit Transaction</h2>
        <div class="text-muted">Update income or expense</div>
    </div>

    <a href="{{ url_for('finance') }}" class="btn btn-outline-secondary">
        ← Back
    </a>
</div>

<div class="card p-4">

<form method="post">

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Date</label>
            <input
                class="form-control"
                type="date"
                name="tx_date"
                value="{{ transaction.tx_date }}"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Type</label>
            <select class="form-select" name="tx_type" required>
                <option value="Income"
                    {% if transaction.tx_type == "Income" %}selected{% endif %}>
                    Income
                </option>
                <option value="Expense"
                    {% if transaction.tx_type == "Expense" %}selected{% endif %}>
                    Expense
                </option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Category</label>
            <input
                class="form-control"
                name="category"
                value="{{ transaction.category }}"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Amount</label>
            <input
                class="form-control"
                type="number"
                step="0.01"
                min="0"
                name="amount"
                value="{{ transaction.amount }}"
                required>
        </div>

        <div class="col-12">
            <label class="form-label">Note</label>
            <textarea
                class="form-control"
                name="note"
                rows="3">{{ transaction.note or '' }}</textarea>
        </div>

    </div>

    <div class="mt-4">
        <button class="btn btn-dark px-4">
            💾 Update Transaction
        </button>

        <a href="{{ url_for('finance') }}"
           class="btn btn-outline-secondary ms-2">
            Cancel
        </a>
    </div>

</form>

</div>

{% endblock %}
