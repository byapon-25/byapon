{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card border-0 shadow-sm rounded-4">
<div class="card-header bg-dark text-white p-4"><h4 class="mb-0">Edit Finance Record</h4></div>
<form method="post"><div class="card-body p-4">
<div class="mb-3"><label class="form-label">Date</label>
<input type="date" name="tx_date" class="form-control" value="{{transaction.tx_date}}" required></div>
<div class="mb-3"><label class="form-label">Type</label>
<select name="tx_type" class="form-select" required>
<option value="Income" {% if transaction.tx_type=="Income" %}selected{% endif %}>Income</option>
<option value="Expense" {% if transaction.tx_type=="Expense" %}selected{% endif %}>Expense</option>
</select></div>
<div class="mb-3"><label class="form-label">Category</label>
<input name="category" class="form-control" value="{{transaction.category}}" required></div>
<div class="mb-3"><label class="form-label">Amount</label>
<input type="number" step="0.01" min="0" name="amount" class="form-control" value="{{transaction.amount}}" required></div>
<div class="mb-3"><label class="form-label">Note</label>
<textarea name="note" class="form-control">{{transaction.note or ''}}</textarea></div>
</div><div class="card-footer p-3">
<a href="{{url_for('finance')}}" class="btn btn-outline-secondary">Back</a>
<button class="btn btn-dark">Save Changes</button>
</div></form></div></div></div>
{% endblock %}
