{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">✏️ Edit Fee</h2>
        <div class="text-muted">Update student fee information</div>
    </div>

    <a href="{{ url_for('fees') }}" class="btn btn-outline-secondary">
        ← Back
    </a>
</div>

<div class="card p-4">

<form method="post">

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Student</label>
            <select name="student_id" class="form-select" required>
                {% for s in students %}
                <option value="{{ s.id }}"
                    {% if s.id == fee.student_id %}selected{% endif %}>
                    {{ s.student_id }} — {{ s.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Fee Month</label>
            <input
                class="form-control"
                type="month"
                name="fee_month"
                value="{{ fee.fee_month }}"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Total Fee</label>
            <input
                class="form-control"
                type="number"
                step="0.01"
                min="0.01"
                name="amount"
                value="{{ fee.amount }}"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Paid Amount</label>
            <input
                class="form-control"
                type="number"
                step="0.01"
                min="0"
                name="paid_amount"
                value="{{ fee.paid_amount }}"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Payment Date</label>
            <input
                class="form-control"
                type="date"
                name="payment_date"
                value="{{ fee.payment_date or '' }}">
        </div>

        <div class="col-12">
            <label class="form-label">Note</label>
            <textarea
                class="form-control"
                name="note"
                rows="3">{{ fee.note or '' }}</textarea>
        </div>

    </div>

    <div class="alert alert-info mt-4 mb-0">
        <strong>Status:</strong>
        {{ fee.status }}
        <br>
        <small>
            Status will be automatically calculated from Total Fee and Paid Amount.
        </small>
    </div>

    <div class="mt-4">
        <button class="btn btn-dark px-4">
            💾 Update Fee
        </button>

        <a href="{{ url_for('fees') }}"
           class="btn btn-outline-secondary ms-2">
            Cancel
        </a>
    </div>

</form>

</div>

{% endblock %}
