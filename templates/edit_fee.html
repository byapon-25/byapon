{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card border-0 shadow-sm rounded-4">
<div class="card-header bg-dark text-white p-4"><h4 class="mb-0">Edit Fee</h4></div>
<form method="post"><div class="card-body p-4">
<div class="mb-3"><label class="form-label">Student</label>
<select name="student_id" class="form-select" required>
{% for s in students %}<option value="{{s.id}}" {% if s.id==fee.student_id %}selected{% endif %}>{{s.name}} — {{s.student_id}}</option>{% endfor %}
</select></div>
<div class="mb-3"><label class="form-label">Fee Month</label>
<input type="month" name="fee_month" class="form-control" value="{{fee.fee_month}}" required></div>
<div class="mb-3"><label class="form-label">Amount</label>
<input type="number" step="0.01" min="0" name="amount" class="form-control" value="{{fee.amount}}" required></div>
<div class="mb-3"><label class="form-label">Paid Amount</label>
<input type="number" step="0.01" min="0" name="paid_amount" class="form-control" value="{{fee.paid_amount}}" required></div>
<div class="mb-3"><label class="form-label">Payment Date</label>
<input type="date" name="payment_date" class="form-control" value="{{fee.payment_date or ''}}"></div>
<div class="mb-3"><label class="form-label">Note</label>
<textarea name="note" class="form-control">{{fee.note or ''}}</textarea></div>
</div><div class="card-footer p-3">
<a href="{{url_for('fees')}}" class="btn btn-outline-secondary">Back</a>
<button class="btn btn-dark">Save Changes</button>
</div></form></div></div></div>
{% endblock %}
