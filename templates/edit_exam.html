{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">✏️ Edit Exam</h2>
        <div class="text-muted">Update exam information</div>
    </div>

    <a href="{{ url_for('exams') }}" class="btn btn-outline-secondary">
        ← Back
    </a>
</div>

<div class="card p-4">

<form method="post">

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Exam Title</label>
            <input
                class="form-control"
                name="title"
                value="{{ exam.title }}"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Subject</label>
            <input
                class="form-control"
                name="subject"
                value="{{ exam.subject }}"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Exam Date</label>
            <input
                class="form-control"
                type="date"
                name="exam_date"
                value="{{ exam.exam_date }}"
                required>
        </div>

        <div class="col-md-3">
            <label class="form-label">Full Marks</label>
            <input
                class="form-control"
                type="number"
                step="0.01"
                min="1"
                name="full_marks"
                value="{{ exam.full_marks }}"
                required>
        </div>

        <div class="col-md-3">
            <label class="form-label">Pass Marks</label>
            <input
                class="form-control"
                type="number"
                step="0.01"
                min="0"
                name="pass_marks"
                value="{{ exam.pass_marks }}"
                required>
        </div>

    </div>

    <div class="mt-4">
        <button class="btn btn-dark px-4">
            💾 Update Exam
        </button>

        <a href="{{ url_for('exams') }}"
           class="btn btn-outline-secondary ms-2">
            Cancel
        </a>
    </div>

</form>

</div>

{% endblock %}
