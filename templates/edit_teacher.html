{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">✏️ Edit Teacher</h2>
        <div class="text-muted">Update teacher information</div>
    </div>

    <a href="{{ url_for('teachers') }}" class="btn btn-outline-secondary">
        ← Back
    </a>
</div>

<div class="card p-4">

<form method="post">

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Name</label>
            <input
                class="form-control"
                name="name"
                value="{{ teacher.name }}"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input
                class="form-control"
                name="phone"
                value="{{ teacher.phone or '' }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Subject</label>
            <input
                class="form-control"
                name="subject"
                value="{{ teacher.subject or '' }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Salary</label>
            <input
                class="form-control"
                type="number"
                step="0.01"
                min="0"
                name="salary"
                value="{{ teacher.salary or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Status</label>
            <select class="form-select" name="active">
                <option value="1"
                    {% if teacher.active %}selected{% endif %}>
                    Active
                </option>
                <option value="0"
                    {% if not teacher.active %}selected{% endif %}>
                    Inactive
                </option>
            </select>
        </div>

    </div>

    <div class="mt-4">
        <button class="btn btn-dark px-4">
            💾 Update Teacher
        </button>

        <a href="{{ url_for('teachers') }}"
           class="btn btn-outline-secondary ms-2">
            Cancel
        </a>
    </div>

</form>

</div>

{% endblock %}
