{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card border-0 shadow-sm rounded-4">

<div class="card-header bg-dark text-white p-4">

<h4 class="mb-1">Edit Teacher</h4>

<div class="small opacity-75">
Update teacher information or reset password.
</div>

</div>

<form method="post">

<div class="card-body p-4">

<div class="mb-3">
<label class="form-label">Teacher ID</label>
<input class="form-control"
       name="teacher_id"
       value="{{teacher.teacher_id}}"
       required>
</div>

<div class="mb-3">
<label class="form-label">Full Name</label>
<input class="form-control"
       name="name"
       value="{{teacher.name}}"
       required>
</div>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Phone</label>
<input class="form-control"
       name="phone"
       value="{{teacher.phone or ''}}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Subject</label>
<input class="form-control"
       name="subject"
       value="{{teacher.subject or ''}}">
</div>

</div>

<div class="mb-3">
<label class="form-label">Qualification</label>
<input class="form-control"
       name="qualification"
       value="{{teacher.qualification or ''}}">
</div>

<div class="mb-3">
<label class="form-label">Monthly Salary</label>
<input type="number"
       step="0.01"
       class="form-control"
       name="salary"
       value="{{teacher.salary or 0}}">
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="text"
       class="form-control"
       name="password"
       value="{{teacher.password}}"
       required>
</div>

<div class="mb-3">
<label class="form-label">Account Status</label>

<select class="form-select" name="active">

<option value="1"
{% if teacher.active %}selected{% endif %}>
Active
</option>

<option value="0"
{% if not teacher.active %}selected{% endif %}>
Inactive
</option>

</select>

</div>

</div>

<div class="card-footer bg-white p-4 d-flex justify-content-between">

<a href="{{url_for('teachers')}}"
   class="btn btn-outline-secondary">
← Back
</a>

<button class="btn btn-dark px-4">
Save Changes
</button>

</div>

</form>

</div>

</div>
</div>

{% endblock %}
