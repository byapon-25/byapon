{% extends "base.html" %}{% block content %}<h2>Attendance</h2></form><form method="post">
<input type="hidden" name="date" value="{{selected_date}}"><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>ID</th><th>Name</th><th>Class/Batch</th><th>Status</th></tr>{% for s in students %}<tr><td>{{s.student_id}}</td><td>{{s.name}}</td><td>{{s.class_name}} / {{s.batch}}</td><td>
<select class="form-select" name="status_{{s.id}}">
<option {% if s.status=='Present' %}selected{% endif %}>Present</option>
<option {% if s.status=='Absent' %}selected{% endif %}>Absent</option>
<option {% if s.status=='Late' %}selected{% endif %}>Late</option>
</select>
{% if s.attendance_id %}
<a href="{{url_for('edit_attendance',aid=s.attendance_id)}}"
   class="btn btn-sm btn-warning mt-2">✏️ Edit</a>
{% endif %}
</td></tr>{% endfor %}</table></div><button class="btn btn-success">Save Attendance</button></div></form>{% endblock %}
