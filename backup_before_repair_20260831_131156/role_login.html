<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYAPON | {{ panel }} Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
background:#05070d;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.login{
width:min(430px,92%);
padding:35px;
border-radius:24px;
background:rgba(15,23,42,.92);
border:1px solid rgba(255,255,255,.12);
box-shadow:0 25px 80px #0009;
}

.logo{
font-size:28px;
font-weight:800;
letter-spacing:2px;
}

.panel{
display:inline-block;
margin-top:18px;
padding:7px 14px;
border-radius:30px;
background:#facc15;
color:#111827;
font-size:13px;
font-weight:800;
}

.subtitle{
color:#9ca3af;
margin:15px 0 28px;
}

.form-control{
height:52px;
border-radius:12px;
background:#111827;
border:1px solid #374151;
color:#fff;
}

.form-control:focus{
background:#111827;
color:#fff;
border-color:#f5d76e;
box-shadow:0 0 0 3px rgba(245,215,110,.12);
}

.login-btn{
height:52px;
border:0;
border-radius:12px;
font-weight:700;
background:linear-gradient(135deg,#f5d76e,#fff1a8);
color:#111827;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#9ca3af;
text-decoration:none;
font-size:14px;
}

.back:hover{
color:#fff;
}

.hint{
font-size:11px;
color:#6b7280;
margin-top:18px;
text-align:center;
}
</style>
</head>

<body>

<div class="login">

<div class="logo">📚 BYAPON</div>

<div class="panel">
{{ panel }} PORTAL
</div>

<div class="subtitle">
Coaching Management System
</div>

{% with messages=get_flashed_messages(with_categories=true) %}
{% for c,m in messages %}
<div class="alert alert-{{c}}">{{m}}</div>
{% endfor %}
{% endwith %}

</form>

<a href="{{ url_for('home') }}" class="back">
← Back to Homepage
</a>

<div class="hint">
Secure access • BYAPON Coaching
</div>

</div>

</body>
</html>
