{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Edit Teacher Assignment</h2>
    <a href="{{ url_for('teacher_assignments') }}" class="btn btn-outline-secondary">← Back</a>
</div>

<div class="card p-4">
<form method="post">

    <div class="mb-3">
        <label class="form-label">Teacher</label>
        <select class="form-select" name="teacher_id" required>
            {% for t in teachers %}
            <option value="{{ t.id }}" {% if t.id == assignment.teacher_id %}selected{% endif %}>
                {{ t.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Batch</label>
        <input class="form-control" name="batch"
               value="{{ assignment.batch }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Subject</label>
        <input class="form-control" name="subject"
               value="{{ assignment.subject }}" required>
    </div>

    <button type="submit" class="btn btn-dark">Save Changes</button>
    <a href="{{ url_for('teacher_assignments') }}"
       class="btn btn-outline-secondary">Cancel</a>

</form>
</div>
{% endblock %}
