{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Edit Coaching Day</h2>
    <a href="{{ url_for('calendar') }}" class="btn btn-outline-secondary">← Back</a>
</div>

<div class="card p-4">
<form method="post">

    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" class="form-control"
               name="day_date"
               value="{{ day.day_date }}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" name="status" required>
            <option value="Open" {% if day.status == 'Open' %}selected{% endif %}>Open</option>
            <option value="Off" {% if day.status == 'Off' %}selected{% endif %}>Off</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Note</label>
        <textarea class="form-control" name="note" rows="3">{{ day.note or '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-dark">Save Changes</button>
    <a href="{{ url_for('calendar') }}"
       class="btn btn-outline-secondary">Cancel</a>

</form>
</div>
{% endblock %}
