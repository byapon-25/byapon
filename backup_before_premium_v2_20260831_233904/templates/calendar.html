{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Coaching Open / Off</h2><button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#add">+ Set Day</button></div><div class="card p-3"><div class="table-responsive"><table class="table">
<tr><th>Date</th><th>Status</th><th>Note</th><th>Action</th></tr>
{% for d in days %}
<tr>
<td>{{d.day_date}}</td>
<td><span class="badge {{'text-bg-success' if d.status=='Open' else 'text-bg-danger'}}">{{d.status}}</span></td>
<td>{{d.note}}</td>
<td>
<div class="d-flex gap-1">
<a class="btn btn-sm btn-warning"
   href="{{url_for('edit_calendar_day',cid=d.id)}}">✏️ Edit</a>
<form method="post"
      action="{{url_for('delete_calendar_day',cid=d.id)}}"
      onsubmit="return confirm('Are you sure you want to delete this calendar record?');">
<button type="submit" class="btn btn-sm btn-outline-danger">🗑️ Delete</button>
</form>
</div>
</td>
</tr>
{% endfor %}
</table></div></div><div class="modal fade" id="add"><div class="modal-dialog"><div class="modal-content"></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% endblock %}
